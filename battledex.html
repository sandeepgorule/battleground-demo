<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My BattleDex — Battleground</title>
  <meta name="description" content="Your saved Battleground fighters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="arena arena--dex">
    <header class="hud">
      <a class="hud__logo" href="index.html">Battle<span class="hud__logo-sword">&#9876;&#65039;</span>ground</a>
      <a class="hud__link" href="index.html">New Fight</a>
    </header>

    <main class="dex">
      <div class="dex__header">
        <div class="dex__heading">
          <h1 class="dex__title">My BattleDex</h1>
          <div id="dexMeta" class="dex__meta" hidden>
            <span id="dexCount" class="dex__count"></span>
            <span class="dex__note">Oldest fighter drops out when the roster is full.</span>
          </div>
        </div>
        <div class="dex__actions">
          <a id="lastFightLink" class="ghost-button" href="index.html?recap=1" hidden>Back to Last Fight</a>
          <button id="clearDexButton" class="ghost-button ghost-button--danger" type="button" hidden>Clear All</button>
        </div>
      </div>

      <div id="dexEmpty" class="dex__empty" hidden>
        <span class="dex__empty-title">Roster empty</span>
        <p>No fighters saved yet. Win or lose, save your favorites after a fight.</p>
        <a class="big-button big-button--small" href="index.html">Start a Fight</a>
      </div>

      <div id="dexGrid" class="dex__grid"></div>
    </main>

    <div class="scanlines" aria-hidden="true"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/battledex.js"></script>
</body>
</html>
